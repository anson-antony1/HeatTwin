clothing_conservative:
  status: DESIGN
  justification: "Planning default because, calibrated on Armstrong 2010's full-uniform rise, it reproduces the measured rises (validation/results.json armstrong_2010); the walking-ventilation credit stays off because the control-clothing rate rules it out (owner decision)."
  note: "Planning-default clothing mode ('conservative' is the historical name; it is now the Armstrong-calibrated mode). ISO 7933 dynamic structure with the wind credit kept and the walking-ventilation credit off (with the ACSM treadmill MET and the 5 % grade's external work subtracted, credit off reproduces Armstrong CON; credit on under-predicts it by ~1 SD) plus a gear load surcharge on metabolic heat, M × (1 + δ·w(gear)), δ fitted to Armstrong 2010's mean FULL whole-protocol rise (2.37 °C). The surcharge is metabolic: applied before the VO2max ceiling and inside the live-HR observation model. δ lumps uniform weight, pad coverage and sweat-soaking (Armstrong and Hitchcock 2007 attribute extra metabolic cost to the uniform); it is a calibration, not a measured quantity. Safety margin lives in p95 + the AT-owned limit, not in the median physics."
  calibrated_by: "validation/armstrong_2010.py --calibrate"
  calibration_metric: whole_rise    # owner decision Oct 3: fit Table 3 whole-protocol FULL rise (2.37 °C); safety margin lives in p95 + the AT limit, not in median physics
  calibration_target: "armstrong_2010.rise_c.FULL (mean, 2.37 °C over 56.2 min)"
  alternative_fit_treadmill_rate: 0.1348   # δ fitted to Table 4 FULL treadmill rate 0.071 °C/min (mean of individual rates; early terminations bias it high) — reported, not used
  iso_correction_fraction: 1.0
  walk_credit_fraction: 0.0          # owner rule (Oct 3): keep or drop by which reproduces Armstrong CON — with the ACSM treadmill MET and the grade's external work subtracted, credit off fits CON (−0.08 SD rate, +0.10 SD rise) and credit on does not (−0.98 / −1.67 SD); see validation results walk_credit_check
  surcharge_weight_by_gear:        # DESIGN: share of the full-pads surcharge per gear level
    none: 0.0
    helmet: 0.0                    # helmet-only already borrows the helmet + shoulder-pads clothing values (TODO); no extra surcharge until a helmet-only ensemble is measured
    helmet_shoulder_pads: 0.636    # intrinsic-insulation interpolation (0.63 − 0.35)/(0.79 − 0.35)
    full_pads: 1.0
  gear_met_surcharge_full_pads: 0.0486   # computed by validation/armstrong_2010.py --calibrate (FULL whole-protocol rise 2.37 °C)


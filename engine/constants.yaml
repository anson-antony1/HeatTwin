# Every constant the engine uses. Logic reads from here; nothing is hard-coded.
# status: VERIFIED  = checked against the cited source
#         SECONDARY = from a secondary summary; confirm against the primary source before quoting on a slide
#         TODO      = placeholder; a sub-agent must find and cite a source before the demo uses it
#         DESIGN    = a modelling/product choice (not a sourced fact); an AT/coach should own it, and the UI labels it

fhsaa_wbgt_zones:   # Florida statewide WBGT chart, practices
  status: VERIFIED
  source: "Bylaws of the Florida High School Athletic Association 2025-26 (FHSAA Handbook, revised 4/24/26), Policy 41 Exertional Heat Illness, §41.8.3 WBGT Index for Practices, p.107 (read). Summary also in Perry Weather, '2026 Heat Stress Playbook: Florida'."
  url: "https://s3.amazonaws.com/fhsaa.org/documents/2026/4/27/2526_handbook_42426.pdf ; https://perryweather.com/resources/2026-heat-stress-playbook-florida/"
  quote_or_location: "§41.8.3 table: '< 82.0 Normal activities.' '82.1 - 87.0 Three (3) separate four (4) minute rest breaks per hour of activity.' '87.1 - 90.0 Maximum two (2) hour activity time. Four (4) separate four (4) minute rest breaks per hour of activity. For football, student-athletes are restricted to helmet, shoulder pads and shorts during activity. If WBGT reading rises to this level after practice has begun, student-athletes may continue to workout wearing football pants without changing into shorts.' '90.1 - 92.0 Maximum one (1) hour activity time. Five (5) separate four (4) minute rest breaks. No protective equipment permitted. No conditioning activities permitted.' '≥ 92.1 No outdoor activities.'"
  note: "Readings are to 0.1 °F; engine/fhsaa.py rounds WBGT to 0.1 before applying the bands. Zone 4's 'five breaks' has no 'per hour' but the zone allows only 1 h, so it is applied per hour."
  zone3_pants_if_rose_after_start: true   # §41.8.3 zone-3 exception: full pads (pants) may stay on if zone 3 began after practice started
  zones:
    - {zone: 1, wbgt_f_max: 82.0, activity: "normal", breaks_per_hour: 0, break_min: 0, max_duration_min: null, gear: "any"}
    - {zone: 2, wbgt_f_max: 87.0, activity: "unrestricted", breaks_per_hour: 3, break_min: 4, max_duration_min: null, gear: "any"}
    - {zone: 3, wbgt_f_max: 90.0, activity: "max 2 h", breaks_per_hour: 4, break_min: 4, max_duration_min: 120, gear: "football: helmet, shoulder pads, shorts only"}
    - {zone: 4, wbgt_f_max: 92.0, activity: "max 1 h", breaks_per_hour: 5, break_min: 4, max_duration_min: 60, gear: "no protective gear, no conditioning"}
    - {zone: 5, wbgt_f_max: 999, activity: "no outdoor activity", breaks_per_hour: null, break_min: null, max_duration_min: 0, gear: "n/a"}
  measurement: "15–20 min before activity, then every 30 min"   # §41.7.2, §41.7.5
  cooling_zone_required_above_wbgt_f: 82.1
  cooling_zone_status: SECONDARY
  cooling_zone_note: "82.1 °F threshold is from the Perry Weather summary ('Above 82.1°F, cold water immersion tubs or ice and water tarps must be available'). The handbook (§41.8.4-41.8.5) defines cooling zones (CWI tub or TACO + trained individual) and requires them 'for each outdoor athletic contest, practice, workout, or conditioning session as designated by this policy' without a WBGT number in the text read; §41.7.1 triggers WBGT recording and modifications when WBGT is 'reasonably expected to exceed 82 degrees'."

fhsaa_practice_limits:
  status: VERIFIED
  source: "FHSAA Handbook 2025-26, Policy 41 §41.5.7 and §41.5.12, p.106 (read)"
  url: "https://s3.amazonaws.com/fhsaa.org/documents/2026/4/27/2526_handbook_42426.pdf"
  quote_or_location: "§41.5.12 'On days when a single practice is conducted, practices shall not exceed three (3) hours in length.' §41.5.7 'Football only (including spring): ... the first two (2) days of practice are restricted to helmets only, days 3-5 can introduce shoulder-pads with shorts and then beginning day six (6) of practice, full gear can be utilized'"
  max_single_practice_min: 180
  football_gear_by_day:             # last practice day on which each gear level is the maximum allowed
    - {through_day: 2, max_gear: helmet}
    - {through_day: 5, max_gear: helmet_shoulder_pads}
  gear_order: [none, helmet, helmet_shoulder_pads, full_pads]   # DESIGN: GearLevel from least to most protective equipment
  note: "Applies football acclimatization by Athlete.acclimatization_day, treated as the athlete's practice day (CONTRACTS.md defines it as day of heat exposure this preseason)."

ksi_cwi:
  status: VERIFIED
  source: "Korey Stringer Institute, Cold Water Immersion Guide (2024 resource update)"
  url: "https://koreystringer-institute.media.uconn.edu/wp-content/uploads/sites/3814/2024/08/ColdWaterImmersionGuide_ResourceUpdate_8.pdf"
  water_temp_c_max: 15            # "under 15C (under 60°F)"
  cooling_rate_c_per_5min: 1      # "approximately 1ºC for every five minutes ... if the water is aggressively stirred"
  no_rectal_thermometer_cool_min: [10, 15]   # "Cool for 10-15 minutes and then transport"
  remove_at_rectal_c: 39.0        # "only after rectal temperature reaches 39ºC (102ºF)"
  tub_within_min_of_field: [5, 10]

guard_exceptions:   # engine/guard.py: phrases a named, fixed script may say although the guard blocks them elsewhere
  status: VERIFIED
  source: "Korey Stringer Institute, Cold Water Immersion Guide ('How to Respond to an Exertional Heat Stroke Emergency', 2024 resource update), step 1 'Initial response' (read)"
  url: "https://koreystringer-institute.media.uconn.edu/wp-content/uploads/sites/3814/2024/08/ColdWaterImmersionGuide_ResourceUpdate_8.pdf"
  quote_or_location: "Step 1: 'Initial response. Once exertional heat stroke is suspected, prepare to cool the patient and contact emergency medical services (EMS).'"
  note: "Owner decision (polish 2a, Oct 4): the Collapse 911 script (web/src/views/CollapseMode.tsx, step 'call') is coach-initiated after an observed collapse and tells dispatch what is suspected, per KSI step 1. Only that script, and only this phrase, is exempt from the guard's 'suspected <heat illness>' diagnosis rule; every other source (generated labels, voice, /guard) still has it removed."
  scripts:
    collapse.911_script: ["suspected exertional heat stroke"]

mhsaa_cwi_2026:
  status: VERIFIED
  source: "MHSAA SMAC Cold Water Immersion Update 2026"
  url: "https://www.misshsaa.com/2026/08/10/smac-cold-water-immersion-update-2026/"
  water_temp_f_range: [35, 58]
  do_not_use_alternate_temp_methods: true   # oral, tympanic, axillary, forehead
  ehs_rectal_f: 105

nata_ehs:
  status: VERIFIED
  source: "NATA Exertional Heat Illnesses position statement, executive summary"
  url: "https://www.nata.org/sites/default/files/heat-illness-executive-summary.pdf"
  ehs_core_f: 105
  goal_below_f_within_30min: 102.5
  acclimatization_days: [7, 14]

planning_limit_core_c:
  status: VERIFIED
  source: "NIOSH [2016] Criteria for a Recommended Standard: Occupational Exposure to Heat and Hot Environments. DHHS (NIOSH) Publication 2016-106 (read by source-checker)"
  url: "https://www.cdc.gov/niosh/docs/2016-106/pdfs/2016-106.pdf"
  quote_or_location: "p.125 §10.2: 39 °C 'should be considered reason to terminate exposure'; p.97 (WHO 1969): 'In closely controlled conditions, the deep body temperature may be allowed to rise to 39°C'"
  value: 39.0
  note: "Illustrative planning threshold an athletic trainer owns, applied to the model's p95 estimate. Not a diagnostic or treatment threshold (EHS diagnosis: >40.5 °C rectal + CNS dysfunction, NATA 2015)."
  alternatives:
    - {value: 38.0, source: "NIOSH 2016 p.97 quoting WHO 1969 ('inadvisable ... to exceed 38°C ... prolonged daily exposure to heavy work'); p.101 ACGIH; Malchaire 2006 Ind Health 44:383 (PHS mean rectal limit)", status: VERIFIED}
    - {value: 38.5, source: "NIOSH 2016 p.101 (ACGIH): acclimatized workers under supervision, core 'not to exceed 38.5°C'", status: VERIFIED}
  field_context: "Godek et al. 2006 J Athl Train 41:8 — NFL preseason practice max core 38.65 ± 0.48 °C (linemen), 38.44 ± 0.32 °C (backs)"

psi:
  status: VERIFIED
  source: "Moran et al. 1998 PSI formula as presented in Buller, 'Real-Time PSI Assessment' (NRT slides)"
  url: "https://nrt.org/sites/58/files/RT%20PSI%20Assessment%20-%20M.%20Buller.pdf"
  formula: "5*(CT_t-CT_rest)/(39.5-CT_rest) + 5*(HR_t-HR_rest)/(180-HR_rest)"

ect_buller_2013:     # OPTIONAL MODULE — method appears patented
  status: TODO
  note: "Coefficients below are from memory of Buller et al. 2013 (Physiol Meas 34:781). Verify against the paper/MATLAB code before use."
  a: 1.0
  gamma: 0.000484        # 0.022^2
  b0: -7887.1
  b1: 384.4286
  b2: -4.5714
  sigma: 356.4544        # 18.88^2
  ct0_c: 37.1
  v0: 0.0

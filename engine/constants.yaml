shade_model:
  status: DESIGN
  justification: "No measured radiant field under a canopy is available; MRT = air temperature in shade is the standard simplification. It biases in-shade estimates LOW (not conservative) and is labelled so (MODEL.md §6.3)."
  note: "Shaded drills / cooling area: mean radiant temperature = air temperature (canopy blocks all shortwave; hot-ground longwave ignored). Biases in-shade predictions low. See MODEL.md §6.3."
  mrt_equals_air_temp: true

live_suggest:   # engine/suggest.py: the fast re-plan offered when a live athlete's re-forecast crosses the line
  status: DESIGN
  justification: "Owner spec (overnight item 3, Oct 4): a fast, targeted re-plan for the flagged athlete only, for the rest of the session — at most 2 changes, at most 3 s of search, every sentence through the guard. A suggestion the coach applies, never an automatic change. The rest block is one FHSAA rest-break length (fhsaa_wbgt_zones, 4 min) and the look-ahead covers the next three blocks so a suggestion acts soon."
  source: "HeatTwin design (owner spec); rest block = FHSAA Policy 41 §41.8.3 break length"
  max_changes: 2
  budget_s: 3.0
  lookahead_blocks: 3
  rest_block_from: fhsaa_wbgt_zones.zones.1.break_min   # 4 min (zone 2 rest break)

live_demo:   # engine/calibrate.py LiveSession(observe=…): the strap wearer's HR read against the drill they are doing
  status: DESIGN
  justification: "Owner decision (polish 4, Oct 4): in a live demo the strap wearer does burpees, which match the plan's conditioning intensity, so their HR is read against that drill, not the plan drill at the clock. A wearer also stands or recovers between sets; reading those minutes as conditioning drives met_scale far below 1 with no way back (the filter has no process noise), so the re-forecast would err cool. Rule (no new number): a window whose mean HR is nearer the model's HR for resting (non_participant.intensity) than for the mapped drill, both at the current ensemble, is skipped and labelled — never assimilated as rest, because the linear MET model is weakest at rest."
  rule: "midpoint = (mean HR_pred(rest MET·θ) + mean HR_pred(drill MET·θ)) / 2; assimilate the mean of the window's readings ≥ midpoint when they cover ≥ min_coverage_fraction of the window, else skip the window as rest"
  source: "HeatTwin design (polish 4); observation model = constants.hr_model / hr_met (Swain & Leutholtz 1997)"

non_participant:
  status: DESIGN
  justification: "A plan doesn't say where rotated-out athletes stand; resting in the shaded cooling area matches FHSAA cooling-zone practice. It is an AT-owned setting the coach should confirm."
  note: "Athletes not listed in a drill's participants rest in the shaded cooling area, keeping the drill's gear. Coach/AT should confirm this matches how the team rotates players."
  intensity: rest
  shade: true

near_limit_margin_c:
  status: DESIGN
  note: "UI band: status 'near_limit' when peak p95 is within this margin of the planning limit. Product choice; AT owns it."
  value: 0.3

ensemble_defaults:
  status: DESIGN
  note: "Truncation of ensemble draws at ±k SD, floor above zero. Numerical choice, not physiology."
  truncate_sd: 3.0
  min_scale: 0.05

clear_sky_fallback:
  status: SECONDARY
  source: "Clear sky: Haurwitz B (1945) J Meteorol 2:154-166 — coefficients read from pvlib-python clearsky.haurwitz (main). Cloud: Kasten F, Czeplak G (1980) Solar Energy 24:177-190 — formula as quoted in CSBE/SCGAB 2017 meeting paper CSBE17057, eq. (1). Primary papers not read."
  url: "https://github.com/pvlib/pvlib-python/blob/main/pvlib/clearsky.py ; https://library.csbe-scgab.ca/docs/meetings/2017/CSBE17057.pdf"
  quote_or_location: "pvlib: ghi_clear = 1098.0 * cos_zenith * np.exp(-0.059/cos_zenith); CSBE17057 eq.(1): Ig = Igc (1 - 0.75 (N/8)^3.4), N in octas"
  note: "Used only when the forecast has no solar_w_m2 and engine/wbgt.py (WS1) is absent; output is labelled."
  haurwitz_a: 1098.0
  haurwitz_b: 0.059
  kc_a: 0.75
  kc_b: 3.4

model_options:
  status: DESIGN
  justification: "cap_mode 'consistent' follows the definition of skin wettedness (evaporation ≤ w_crit·E_max); the ASHRAE 55 code's +0.06 allowance is kept only as a reference mode for the pythermalcomfort cross-check."
  note: "cap_mode 'consistent' = skin evaporation capped at w_crit·E_max (definition of wettedness); 'ashrae55_reference' reproduces pythermalcomfort/ASHRAE 55 code, which allows (w_crit + 0.06)·E_max. See MODEL.md §7.3."
  cap_mode: consistent
  max_internal_dt_s: 30           # numerical: integration sub-step; outputs stay on the step_min grid (Euler lag at drill boundaries)
  clothing_mode: conservative      # 'conservative' (default: ISO structure, wind credit kept, walking-ventilation credit off, calibrated gear surcharge) | 'iso7933_dynamic' (alternate) | 'gagge_static' (reference structure)

acclimatization:
  status: DESIGN
  justification: "No study gives the day-by-day time course of heat acclimatization in adolescent football players; a piecewise-linear course between the verified (mostly laboratory) magnitudes is the simplest form consistent with them (MODEL.md §8). Review with the AT."
  enabled: true
  note: "Magnitudes are VERIFIED in the cited (mostly laboratory) studies; the piecewise-linear time course and their transfer to adolescent football players are modelling choices. MODEL.md §8."
  setpoint_shift:
    status: VERIFIED
    source: "Buono MJ et al. (1998) Am J Physiol 274:R1295 (abstract); Mee JA et al. (2018) J Sci Med Sport 21:190 (abstract)"
    url: "https://pubmed.ncbi.nlm.nih.gov/9644042/ ; https://pubmed.ncbi.nlm.nih.gov/28739443/"
    quote_or_location: "Buono: resting Tre 'decreased from 37 +/- 0.3 to 36.7 +/- 0.4 degrees C' (range -0.1 to -0.5); Mee: resting Tre -0.28±0.16 °C and Tre at sweating onset -0.29±0.17 °C"
  sweat_gain:
    status: VERIFIED
    source: "Poirier MP et al. (2015) Med Sci Sports Exerc 47:390-400 (abstract)"
    url: "https://pubmed.ncbi.nlm.nih.gov/24870585/"
    quote_or_location: "whole-body evaporative heat loss +4.9 to +9.0% by day 7, +7.6 to +11.2% by day 14; 'can improve by as much as approximately 11%'"
  time_course:
    status: VERIFIED
    source: "Périard JD, Racinais S, Sawka MN (2015) Scand J Med Sci Sports 25(S1):20-38; Casa DJ et al. (2009) J Athl Train 44(3):332 (PMC2681206)"
    url: "https://onlinelibrary.wiley.com/doi/full/10.1111/sms.12408"
    quote_or_location: "Périard: '75–80% of the adaptations occur in the first 4–7 days', complete after 10–14 days; Casa 2009: acclimatization period = 'the initial 14 consecutive days of preseason practice'"
  decay:
    status: VERIFIED
    source: "Daanen HAM, Racinais S, Périard JD (2018) Sports Med 48:409-430 (abstract, PMC5775394)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5775394/"
    quote_or_location: "'For every decay day, ~ 2.5% of the adaptations in HR and Tc are lost'"
  full_setpoint_shift_c: 0.3          # lowers T_cr,n (and so T_b,n, resting core and sweating onset) at full adaptation
  full_sweat_gain_increase: 0.11      # sweat-gain multiplier 1 + 0.11 at full adaptation
  fraction_curve_day: [1, 6, 14]      # DESIGN: day 1 = first heat day (no adaptation); ~75% by day 6 (Périard 4–7 d); 100% by day 14
  fraction_curve_value: [0.0, 0.75, 1.0]
  decay_per_day_without_heat: 0.025   # fraction of adaptation lost per day beyond the first since the last heat session

ensemble_priors:
  status: DESIGN
  justification: "Before any HR calibration there is no per-athlete data; spreads derived from verified tables make the uncertainty explicit (p95), and live HR narrows it (WS3)."
  note: "Prior SDs when an athlete has no calibration. Derived (by the source-checker) from verified tables; using them as SDs of the model's scale factors is an inference."
  met_scale_sd: 0.20
  met_scale_source: "Kozey SL et al. (2010) Med Sci Sports Exerc 42:1776, Table 3 (PMC2924952): between-person CV of measured METs, median ~20% (range 12–31%) across 23 activities"
  thermo_scale_sd: 0.15
  thermo_scale_source: "Armstrong LE et al. (2010) J Athl Train 45:117 (PMC2838463): sweat-rate CV 13–17% in linemen under controlled lab conditions (field CVs 22–47% also include body size and metabolic rate, which the model already represents)"

solarcal_ground:
  status: SECONDARY
  source: "Grass: Allen RG et al. (1998) FAO Irrigation and Drainage Paper 56, Ch. 3 (VERIFIED). Turf: Singh G et al. (2024) Int J Biometeorol 68:1235, Table 1, tabulating Loveday et al. 2019b (primary not read)"
  url: "https://www.fao.org/3/x0490e/x0490e07.htm ; https://doi.org/10.1007/s00484-024-02679-5"
  quote_or_location: "FAO-56: 'A green vegetation cover has an albedo of about 0.20-0.25. For the green grass reference crop, a is assumed to have a value of 0.23.' Singh 2024 Table 1 (Loveday 2019b): synthetic grass 0.10, 0.12, 0.11; natural 0.20, 0.22, 0.22"
  reflectance_grass: 0.23
  reflectance_turf: 0.11

irradiance_split:
  status: SECONDARY
  source: "Erbs DG, Klein SA, Duffie JA (1982) Solar Energy 28:293-302 — coefficients from pvlib irradiance.erbs and Reindl 1988 MS thesis Eq. 3.14 (primary paywalled). Solar constant: IAU 2015 Resolution B3 (VERIFIED, arXiv:1510.07674). Earth-sun distance factor: ASCE form 1 + 0.033 cos(2π·doy/365) as in pvlib get_extra_radiation(method='asce') citing Allen et al. (ASCE standardized reference ET)."
  url: "https://github.com/pvlib/pvlib-python/blob/main/pvlib/irradiance.py ; https://arxiv.org/abs/1510.07674"
  quote_or_location: "kt<=0.22: 1-0.09kt; 0.22<kt<=0.80: 0.9511-0.1604kt+4.388kt^2-16.638kt^3+12.336kt^4; kt>0.80: 0.165. IAU: 'S⊙ = 1361 W m−2'"
  solar_constant_w_m2: 1361.0
  eccentricity_amp: 0.033
  days_per_year: 365.0
  erbs_kt_breaks: [0.22, 0.80]
  erbs_low: [1.0, -0.09]
  erbs_mid: [0.9511, -0.1604, 4.388, -16.638, 12.336]
  erbs_high: 0.165
  kt_max: 1.0                     # numerical guard (DESIGN): clearness index cannot exceed 1
  min_sun_elevation_deg: 3.0      # pvlib erbs sets DNI = 0 for zenith > 87°

wind_profile:
  status: SECONDARY
  source: "z0: WMO Codes Registry, Davenport roughness class 'open' (VERIFIED). Log law for 10 m → body height: NWS/MDL Boyer TR (2022) NDFD WBGT Algorithm and Software Design (VERIFIED). 1.1 m standing abdomen height: ISO 7243/7726 as applied in Oliveira et al. 2018 Ind Health 56:62 and Ahmed et al. 2020 Ind Health 58:170 (ISO text paywalled)."
  url: "https://codes.wmo.int/wmdr/SurfaceRoughnessDavenport/open ; https://vlab.noaa.gov/documents/6609493/7858379/NDFD%2BWBGT%2BDescription%2BDocument.pdf"
  quote_or_location: "WMO: 'Level country with low vegetation (e.g. grass) and isolated obstacles … (zo 0.03)'; NDFD: 'To downscale the 10m winds to 2m, the NDFD application applies the Log Law.'; Oliveira 2018: measurements 'at 0.1, 1.1 and 1.7 m'"
  z_ref_m: 10.0
  z_body_m: 1.1
  z0_open_grass_m: 0.03

iso7933_dynamic:
  status: SECONDARY
  source: "ISO 7933:2004 Predicted Heat Strain, dynamic clothing corrections (Havenith, Holmér & Parsons 1999; Holmér et al. 1999) — equations read from pythermalcomfort v3.8.0 models/phs.py (ISO text paywalled, not read)"
  url: "https://github.com/CenterForTheBuiltEnvironment/pythermalcomfort/blob/master/pythermalcomfort/models/phs.py"
  quote_or_location: "phs.py: walk_sp = 0.0052*(met-58) capped 0.7; corr_cl = 1.044*exp((0.066*v_ux-0.398)*v_ux+(0.094*w_a_ux-0.378)*w_a_ux) (v_ux<=3, w_a_ux<=1.5), <=1; corr_ia = exp((0.047*v_r-0.472)*v_r+(0.117*w_a_ux-0.342)*w_a_ux), <=1; corr_tot blends below 0.6 clo; corr_e = (2.6*corr_tot-6.5)*corr_tot+4.9; im_dyn = min(i_mst*corr_e, 0.9); r_t_dyn = i_tot_dyn/im_dyn/16.7; i_a_st = 0.111; w_max = 0.85 (unacclimatized) or 1 (acclimatized)"
  note: "Applied because McCullough & Kenney's manikin was stationary in still air; ISO 7933 is the standard route from static to dynamic clothing values. Walking speed uses ISO's default from metabolic rate (capped at 0.7 m/s), which under-represents running — conservative."
  walk_coeff_m_s_per_w_m2: 0.0052
  walk_met_offset_w_m2: 58.0
  walk_cap_m_s: 0.7
  v_cap_m_s: 3.0
  w_cap_m_s: 1.5
  corr_cl: {scale: 1.044, v2: 0.066, v1: -0.398, w2: 0.094, w1: -0.378}
  corr_ia: {v2: 0.047, v1: -0.472, w2: 0.117, w1: -0.342}
  blend_below_clo: 0.6
  corr_e: [2.6, -6.5, 4.9]          # corr_e = (a*corr_tot + b)*corr_tot + c
  im_dyn_max: 0.9
  lewis_k_per_kpa: 16.7
  i_a_static_m2k_w: 0.111
  w_max_unacclimatized: 0.85
  w_max_acclimatized: 1.0          # interpolated with constants.acclimatization fraction (DESIGN)

optimizer:
  status: DESIGN
  note: "WS4 search settings and product requirements. Not physiology; coach/AT-owned where marked. MODEL.md does not apply."
  priority_weights: {1: 3.0, 2: 2.0, 3: 1.0}      # objective weight per drill priority (product choice)
  p1_min_kept_fraction: 0.9                       # WS4 brief: priority-1 drills kept at ≥ 90 % of their minutes
  max_added_minutes: 20                           # practice may grow by at most this much (coach's time window)
  seed_max_load_from_min_edit: true               # demo mode: max_load also anneals from the minimum compliant edit and keeps the best compliant plan by load (owner decision Oct 3); time-budgeted calls keep default_budget_s
  inserted_break_gear: same_as_previous          # athletes keep the previous drill's gear on an added break (conservative)
  gear_floor_by_intensity: {hard: helmet, max: none}   # contact drills keep at least a helmet (coach-owned; PLAN.md demo: "team period drops to helmets-only")
  trim_step_min: 5
  lengthen_step_min: 4
  min_split_part_min: 5
  beam_width: 3
  beam_depth: 12
  beam_candidates_per_state: 40
  capped_beam_width: 6                          # fewest_changes preset: wider beam that never exceeds the change cap
  capped_beam_candidates_per_state: 80
  swap_probability: 0.5                          # at the change cap, share of SA proposals that undo one change and make another
  repair_loss_floor_pct: 1.0                     # beam ranks fixes by infeasibility removed per % load lost (+ this floor)
  beam_time_fraction: 0.35
  sa_time_fraction_end: 0.75
  sa_max_iterations: 1500
  sa_restarts: 8                                 # multi-start; the time budget is split across restarts
  sa_t0: 3.0
  sa_t_end: 0.03
  infeasibility_weight: 100.0                    # energy per unit infeasibility (1 FHSAA violation or 0.1 °C over)
  heat_excess_per_unit_c: 0.1
  change_penalty: 0.02                           # tie-break: energy per change (≪ 1 % of load)
  default_budget_s: 8.0
  top_changes_k: 3                               # 'top changes by heat reduction' summary for the UI / voice agent

nata_gear_phasing:
  status: VERIFIED
  source: "Casa DJ, Csillan D et al. (2009) Preseason heat-acclimatization guidelines for secondary school athletics. J Athl Train 44(3):332-333 (PMC2681206), read by source-checker"
  url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2681206/"
  quote_or_location: "Days 1-2: 'a helmet should be the only protective equipment permitted'; days 3-5: 'only helmets and shoulder pads should be worn'; day 6 onward: 'all protective equipment may be worn'"
  note: "Applied per athlete from acclimatization_day. An explicit athlete.gear_limit can only tighten the limit. Breaks count: athletes keep the gear they wear."
  phases:
    - {first_day: 1, last_day: 2, max_gear: helmet}
    - {first_day: 3, last_day: 5, max_gear: helmet_shoulder_pads}
    - {first_day: 6, last_day: 9999, max_gear: full_pads}

armstrong_2010:
  status: VERIFIED
  source: "Armstrong LE, Johnson EC, Casa DJ et al. (2010) The American football uniform: uncompensable heat stress and hyperthermic exhaustion. J Athl Train 45(2):117-127 (PMC2838463) — Methods text and Tables 1, 3, 4 read (table images)"
  url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2838463/"

shade_model:
  status: DESIGN
  note: "Shaded drills / cooling area: mean radiant temperature = air temperature (canopy blocks all shortwave; hot-ground longwave ignored). Biases in-shade predictions low. See MODEL.md §6.3."
  mrt_equals_air_temp: true

non_participant:
  status: DESIGN
  note: "Athletes not listed in a drill's participants rest in the shaded cooling area, keeping the drill's gear. Coach/AT should confirm this matches how the team rotates players."
  intensity: rest
  shade: true

near_limit_margin_c:
  status: DESIGN
  note: "UI band: status 'near_limit' when peak p95 is within this margin of the planning limit. Product choice; AT owns it."
  value: 0.3

ensemble_defaults:
  status: DESIGN
  note: "Truncation of ensemble draws at ±k SD, floor above zero. Numerical choice, not physiology."
  truncate_sd: 3.0
  min_scale: 0.05

clear_sky_fallback:
  status: SECONDARY
  source: "Clear sky: Haurwitz B (1945) J Meteorol 2:154-166 — coefficients read from pvlib-python clearsky.haurwitz (main). Cloud: Kasten F, Czeplak G (1980) Solar Energy 24:177-190 — formula as quoted in CSBE/SCGAB 2017 meeting paper CSBE17057, eq. (1). Primary papers not read."
  url: "https://github.com/pvlib/pvlib-python/blob/main/pvlib/clearsky.py ; https://library.csbe-scgab.ca/docs/meetings/2017/CSBE17057.pdf"
  quote_or_location: "pvlib: ghi_clear = 1098.0 * cos_zenith * np.exp(-0.059/cos_zenith); CSBE17057 eq.(1): Ig = Igc (1 - 0.75 (N/8)^3.4), N in octas"
  note: "Used only when the forecast has no solar_w_m2 and engine/wbgt.py (WS1) is absent; output is labelled."
  haurwitz_a: 1098.0
  haurwitz_b: 0.059
  kc_a: 0.75
  kc_b: 3.4

model_options:
  status: DESIGN
  note: "cap_mode 'consistent' = skin evaporation capped at w_crit·E_max (definition of wettedness); 'ashrae55_reference' reproduces pythermalcomfort/ASHRAE 55 code, which allows (w_crit + 0.06)·E_max. See MODEL.md §7.3."
  cap_mode: consistent
  clothing_mode: conservative      # 'conservative' (default: static clothing + calibrated gear surcharge) | 'iso7933_dynamic' (alternate) | 'gagge_static' (reference structure)

acclimatization:
  status: DESIGN
  enabled: true
  note: "Magnitudes are VERIFIED in the cited (mostly laboratory) studies; the piecewise-linear time course and their transfer to adolescent football players are modelling choices. MODEL.md §8."
  setpoint_shift:
    status: VERIFIED
    source: "Buono MJ et al. (1998) Am J Physiol 274:R1295 (abstract); Mee JA et al. (2018) J Sci Med Sport 21:190 (abstract)"
    url: "https://pubmed.ncbi.nlm.nih.gov/9644042/ ; https://pubmed.ncbi.nlm.nih.gov/28739443/"
    quote_or_location: "Buono: resting Tre 'decreased from 37 +/- 0.3 to 36.7 +/- 0.4 degrees C' (range -0.1 to -0.5); Mee: resting Tre -0.28±0.16 °C and Tre at sweating onset -0.29±0.17 °C"
  sweat_gain:
    status: VERIFIED
    source: "Poirier MP et al. (2015) Med Sci Sports Exerc 47:390-400 (abstract)"
    url: "https://pubmed.ncbi.nlm.nih.gov/24870585/"
    quote_or_location: "whole-body evaporative heat loss +4.9 to +9.0% by day 7, +7.6 to +11.2% by day 14; 'can improve by as much as approximately 11%'"
  time_course:
    status: VERIFIED
    source: "Périard JD, Racinais S, Sawka MN (2015) Scand J Med Sci Sports 25(S1):20-38; Casa DJ et al. (2009) J Athl Train 44(3):332 (PMC2681206)"
    url: "https://onlinelibrary.wiley.com/doi/full/10.1111/sms.12408"
    quote_or_location: "Périard: '75–80% of the adaptations occur in the first 4–7 days', complete after 10–14 days; Casa 2009: acclimatization period = 'the initial 14 consecutive days of preseason practice'"
  decay:
    status: VERIFIED
    source: "Daanen HAM, Racinais S, Périard JD (2018) Sports Med 48:409-430 (abstract, PMC5775394)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5775394/"
    quote_or_location: "'For every decay day, ~ 2.5% of the adaptations in HR and Tc are lost'"
  full_setpoint_shift_c: 0.3          # lowers T_cr,n (and so T_b,n, resting core and sweating onset) at full adaptation
  full_sweat_gain_increase: 0.11      # sweat-gain multiplier 1 + 0.11 at full adaptation
  fraction_curve_day: [1, 6, 14]      # DESIGN: day 1 = first heat day (no adaptation); ~75% by day 6 (Périard 4–7 d); 100% by day 14
  fraction_curve_value: [0.0, 0.75, 1.0]
  decay_per_day_without_heat: 0.025   # fraction of adaptation lost per day beyond the first since the last heat session

ensemble_priors:
  status: DESIGN
  note: "Prior SDs when an athlete has no calibration. Derived (by the source-checker) from verified tables; using them as SDs of the model's scale factors is an inference."
  met_scale_sd: 0.20
  met_scale_source: "Kozey SL et al. (2010) Med Sci Sports Exerc 42:1776, Table 3 (PMC2924952): between-person CV of measured METs, median ~20% (range 12–31%) across 23 activities"

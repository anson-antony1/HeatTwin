# Every constant the engine uses. Logic reads from here; nothing is hard-coded.
# status: VERIFIED  = checked against the cited source
#         SECONDARY = from a secondary summary; confirm against the primary source before quoting on a slide
#         TODO      = placeholder; a sub-agent must find and cite a source before the demo uses it
#         DESIGN    = a modelling/product choice (not a sourced fact); an AT/coach should own it, and the UI labels it

fhsaa_wbgt_zones:   # Florida statewide WBGT chart, practices
  status: SECONDARY
  source: "Perry Weather, '2026 Heat Stress Playbook: Florida' summarizing FHSAA policy — confirm with FHSAA Sports Medicine heat policy PDF"
  url: "https://perryweather.com/resources/2026-heat-stress-playbook-florida/"
  zones:
    - {zone: 1, wbgt_f_max: 82.0, activity: "normal", breaks_per_hour: 0, break_min: 0, max_duration_min: null, gear: "any"}
    - {zone: 2, wbgt_f_max: 87.0, activity: "unrestricted", breaks_per_hour: 3, break_min: 4, max_duration_min: null, gear: "any"}
    - {zone: 3, wbgt_f_max: 90.0, activity: "max 2 h", breaks_per_hour: 4, break_min: 4, max_duration_min: 120, gear: "football: helmet, shoulder pads, shorts only"}
    - {zone: 4, wbgt_f_max: 92.0, activity: "max 1 h", breaks_per_hour: 5, break_min: 4, max_duration_min: 60, gear: "no protective gear, no conditioning"}
    - {zone: 5, wbgt_f_max: 999, activity: "no outdoor activity", breaks_per_hour: null, break_min: null, max_duration_min: 0, gear: "n/a"}
  measurement: "15–20 min before activity, then every 30 min"
  cooling_zone_required_above_wbgt_f: 82.1

ksi_cwi:
  status: VERIFIED
  source: "Korey Stringer Institute, Cold Water Immersion Guide (2024 resource update)"
  url: "https://koreystringer-institute.media.uconn.edu/wp-content/uploads/sites/3814/2024/08/ColdWaterImmersionGuide_ResourceUpdate_8.pdf"
  water_temp_c_max: 15            # "under 15C (under 60°F)"
  cooling_rate_c_per_5min: 1      # "approximately 1ºC for every five minutes ... if the water is aggressively stirred"
  no_rectal_thermometer_cool_min: [10, 15]   # "Cool for 10-15 minutes and then transport"
  remove_at_rectal_c: 39.0        # "only after rectal temperature reaches 39ºC (102ºF)"
  tub_within_min_of_field: [5, 10]

mhsaa_cwi_2026:
  status: VERIFIED
  source: "MHSAA SMAC Cold Water Immersion Update 2026"
  url: "https://www.misshsaa.com/2026/08/10/smac-cold-water-immersion-update-2026/"
  water_temp_f_range: [35, 58]
  do_not_use_alternate_temp_methods: true   # oral, tympanic, axillary, forehead
  ehs_rectal_f: 105

nata_ehs:
  status: VERIFIED
  source: "NATA Exertional Heat Illnesses position statement, executive summary"
  url: "https://www.nata.org/sites/default/files/heat-illness-executive-summary.pdf"
  ehs_core_f: 105
  goal_below_f_within_30min: 102.5
  acclimatization_days: [7, 14]

planning_limit_core_c:
  status: VERIFIED
  source: "NIOSH [2016] Criteria for a Recommended Standard: Occupational Exposure to Heat and Hot Environments. DHHS (NIOSH) Publication 2016-106 (read by source-checker)"
  url: "https://www.cdc.gov/niosh/docs/2016-106/pdfs/2016-106.pdf"
  quote_or_location: "p.125 §10.2: 39 °C 'should be considered reason to terminate exposure'; p.97 (WHO 1969): 'In closely controlled conditions, the deep body temperature may be allowed to rise to 39°C'"
  value: 39.0
  note: "Illustrative planning threshold an athletic trainer owns, applied to the model's p95 estimate. Not a diagnostic or treatment threshold (EHS diagnosis: >40.5 °C rectal + CNS dysfunction, NATA 2015)."
  alternatives:
    - {value: 38.0, source: "NIOSH 2016 p.97 quoting WHO 1969 ('inadvisable ... to exceed 38°C ... prolonged daily exposure to heavy work'); p.101 ACGIH; Malchaire 2006 Ind Health 44:383 (PHS mean rectal limit)", status: VERIFIED}
    - {value: 38.5, source: "NIOSH 2016 p.101 (ACGIH): acclimatized workers under supervision, core 'not to exceed 38.5°C'", status: VERIFIED}
  field_context: "Godek et al. 2006 J Athl Train 41:8 — NFL preseason practice max core 38.65 ± 0.48 °C (linemen), 38.44 ± 0.32 °C (backs)"

psi:
  status: VERIFIED
  source: "Moran et al. 1998 PSI formula as presented in Buller, 'Real-Time PSI Assessment' (NRT slides)"
  url: "https://nrt.org/sites/58/files/RT%20PSI%20Assessment%20-%20M.%20Buller.pdf"
  formula: "5*(CT_t-CT_rest)/(39.5-CT_rest) + 5*(HR_t-HR_rest)/(180-HR_rest)"

ect_buller_2013:     # OPTIONAL MODULE — method appears patented
  status: TODO
  note: "Coefficients below are from memory of Buller et al. 2013 (Physiol Meas 34:781). Verify against the paper/MATLAB code before use."
  a: 1.0
  gamma: 0.000484        # 0.022^2
  b0: -7887.1
  b1: 384.4286
  b2: -4.5714
  sigma: 356.4544        # 18.88^2
  ct0_c: 37.1
  v0: 0.0
  validation_ncaa: "CCC 0.643 all; 78% within ±1.0 °F (PMC7739355)"
  patent: "Method and System for Indirectly Determining Core Body Temperature Using Heart Rate (priority 61/739,765, Dec 2012)"

drill_met:
  status: DESIGN
  source: "Herrmann SD, Willis EA, Ainsworth BE et al. (2024) 2024 Adult Compendium of Physical Activities. J Sport Health Sci 13(1):6-12 (PMID 38242596); values read on pacompendium.com category tables by source-checker"
  url: "https://pacompendium.com/"
  quote_or_location: "codes 07040, 02024, 15232, 15210, 02078 (see values)"
  note: "Each MET value is VERIFIED against the Compendium. The intensity → code mapping is a judgement (DESIGN): the Compendium has no American-football practice/drill codes and covers adults 19-59, so use for ages 15-18 is an extrapolation (the Youth Compendium uses a different, BMR-based scale and has no football entry). Context: Hitchcock et al. 2007 J Strength Cond Res 21:710 measured a simulated practice in collegiate linemen at 'averaged 55%VO(2)max (6.7 METS) overall', range 30-81% VO2max."
  values:
    rest:     {met: 1.3,  code: "07040", description: "Standing quietly (standing in a line)", status: VERIFIED}
    light:    {met: 2.8,  code: "02024", description: "Calisthenics (e.g., curl ups, abdominal crunches, plank), light effort", status: VERIFIED}
    moderate: {met: 4.0,  code: "15232", description: "Football, touch, flag, light effort", status: VERIFIED, compendium_flag: "estimated value (red) in the Compendium"}
    hard:     {met: 8.0,  code: "15210", description: "Football, competitive", status: VERIFIED}
    max:      {met: 11.0, code: "02078", description: "Shuttle running, forward/backward/lateral", status: VERIFIED}

metabolic:
  status: VERIFIED
  source: "Youth Compendium FAQ (NCCOR) and Jetté M, Sidney K, Blümchen G (1990) Clin Cardiol 13:555 (abstract)"
  url: "https://www.nccor.org/tools-youthcompendium/ ; https://pubmed.ncbi.nlm.nih.gov/2204507/"
  quote_or_location: "'In adults, 1 MET represents an oxygen uptake of 3.5 mL·kg-1·min-1 or 1 kcal·kg-1·hr-1'"
  kcal_per_kg_h_per_met: 1.0

gear_clothing:
  status: VERIFIED
  source: "McCullough EA, Kenney WL (2003) Thermal insulation and evaporative resistance of football uniforms. Med Sci Sports Exerc 35(5):832-837, Tables 1-3 (read by source-checker)"
  url: "https://journals.lww.com/acsm-msse/fulltext/2003/05000/thermal_insulation_and_evaporative_resistance_of.17.aspx"
  quote_or_location: "Table 2 (I_t, I_cl, f_cl; I_a = 0.61 clo) and Table 3 (R_e,cl, i_m). Stationary manikin, still air (dry 20 °C, 0.2 m/s; wet 26.7 °C, 0.15 m/s): 'These data were collected under still air conditions with a stationary manikin.'"
  note: "Static values. In the default clothing mode (model_options.clothing_mode = iso7933_dynamic) I_t and i_m are corrected for wind and body movement per ISO 7933 (constants.iso7933_dynamic) before use; r_ecl_m2kpa_w is used only in the static mode."
  i_a_static_m2k_w: 0.0946   # manikin still-air layer: Table 2 footnote 'Icl was calculated using an Ia value of 0.61 clo' (0.61 × 0.155)
  levels:
    none:                  {ensemble: "Reference: T-shirt, briefs, shorts, ankle socks, athletic shoes", i_t_clo: 0.90, i_cl_clo: 0.35, f_cl: 1.10, r_ecl_m2kpa_w: 0.009, i_m: 0.42, mapping: "good match (athletic shoes, not cleats)"}
    helmet:                {ensemble: "NOT MEASURED — uses P2 (helmet + shoulder pads) values", i_t_clo: 1.14, i_cl_clo: 0.63, f_cl: 1.20, r_ecl_m2kpa_w: 0.017, i_m: 0.40, status: TODO, mapping: "DESIGN: no published helmet-only ensemble; conservatively takes P2 (overestimates heat strain)"}
    helmet_shoulder_pads:  {ensemble: "P2 practice: helmet, shoulder pads, cut-off T-shirt, mesh jersey, mesh shorts", i_t_clo: 1.14, i_cl_clo: 0.63, f_cl: 1.20, r_ecl_m2kpa_w: 0.017, i_m: 0.40, mapping: "good match (P2 also has a mesh jersey)"}
    full_pads:             {ensemble: "G1 warm-weather game uniform (P1 + pants with knee pads)", i_t_clo: 1.28, i_cl_clo: 0.79, f_cl: 1.25, r_ecl_m2kpa_w: 0.022, i_m: 0.37, mapping: "judgement call: lightest full uniform; P1 (0.71 clo, 0.020) would fit 'shells'"}

hr_max_formula:
  status: VERIFIED
  source: "Tanaka H, Monahan KD, Seals DR (2001) Age-predicted maximal heart rate revisited. J Am Coll Cardiol 37:153-156 (full text); youth check: Cicone ZS et al. (2019) Res Q Exerc Sport 90:417 (abstract)"
  url: "https://pubmed.ncbi.nlm.nih.gov/11153730/ ; https://pubmed.ncbi.nlm.nih.gov/31157608/"
  quote_or_location: "'208 - 0.7 x age in healthy adults' (derived in adults 18-81). Cicone 2019: in youth Tanaka underestimates HRmax by 2.7 bpm; 'if the use of age-based equations cannot be avoided, we recommend using the Tanaka equation.'"
  note: "See hr_met.hr_max (the values the code reads)."

hr_met:
  status: VERIFIED
  source: "Swain DP & Leutholtz BC (1997) Med Sci Sports Exerc 29:410 (abstract); Swain et al. (1998) MSSE 30:318 (abstract); Tanaka et al. 2001; Jetté et al. 1990; Boden BP et al. (2022) Sports Health 14:490 (abstract, PMC9214909)"
  url: "https://pubmed.ncbi.nlm.nih.gov/9139182/ ; https://pubmed.ncbi.nlm.nih.gov/34806472/"
  quote_or_location: "Swain 1997: '%HRR versus %VO2R, the mean intercept and slope were -0.1 +/- 0.6 and 1.00 +/- 0.01'. Boden 2022: VO2peak all 38.5 ± 8.6, linemen 32.8 ± 6.4, non-linemen 41.8 ± 7.9 mL/kg/min (79 high-school players)."
  note: "%HRR ≈ %VO2R shown in adults only; extrapolated to 15-18."
  hr_max: {intercept_bpm: 208.0, age_coeff_bpm_per_yr: 0.7}
  ml_o2_per_kg_min_per_met: 3.5
  vo2max_default_ml_kg_min: 38.5
  vo2max_by_group_ml_kg_min: {linemen: 32.8, non_linemen: 41.8}
  linemen_positions: ["OL", "DL"]
  sustained_vo2max_fraction: 0.81
  sustained_vo2max_fraction_source: "Hitchcock KM et al. (2007) J Strength Cond Res 21:710 (abstract): simulated football practice drills 'ranged from 30 to 81% VO(2)max but averaged 55%VO(2)max'. Used as the ceiling on drill-average metabolic rate (DESIGN use of a VERIFIED number): the highest drill intensity measured in football practice."

wbgt_model:
  status: VERIFIED
  source: "Liljegren et al. 2008 model; open implementation PyWBGT (Kong & Huber 2022)"
  url: "https://github.com/QINQINKONG/PyWBGT"

wbgt_globe_height_m:
  status: TODO
  note: "Confirm standard measurement height for standing subjects (ISO 7243)."


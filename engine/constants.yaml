  thermo_scale_source: "Armstrong LE et al. (2010) J Athl Train 45:117 (PMC2838463): sweat-rate CV 13–17% in linemen under controlled lab conditions (field CVs 22–47% also include body size and metabolic rate, which the model already represents)"

solarcal_ground:
  status: SECONDARY
  source: "Grass: Allen RG et al. (1998) FAO Irrigation and Drainage Paper 56, Ch. 3 (VERIFIED). Turf: Singh G et al. (2024) Int J Biometeorol 68:1235, Table 1, tabulating Loveday et al. 2019b (primary not read)"
  url: "https://www.fao.org/3/x0490e/x0490e07.htm ; https://doi.org/10.1007/s00484-024-02679-5"
  quote_or_location: "FAO-56: 'A green vegetation cover has an albedo of about 0.20-0.25. For the green grass reference crop, a is assumed to have a value of 0.23.' Singh 2024 Table 1 (Loveday 2019b): synthetic grass 0.10, 0.12, 0.11; natural 0.20, 0.22, 0.22"
  reflectance_grass: 0.23
  reflectance_turf: 0.11

irradiance_split:
  status: SECONDARY
  source: "Erbs DG, Klein SA, Duffie JA (1982) Solar Energy 28:293-302 — coefficients from pvlib irradiance.erbs and Reindl 1988 MS thesis Eq. 3.14 (primary paywalled). Solar constant: IAU 2015 Resolution B3 (VERIFIED, arXiv:1510.07674). Earth-sun distance factor: ASCE form 1 + 0.033 cos(2π·doy/365) as in pvlib get_extra_radiation(method='asce') citing Allen et al. (ASCE standardized reference ET)."
  url: "https://github.com/pvlib/pvlib-python/blob/main/pvlib/irradiance.py ; https://arxiv.org/abs/1510.07674"
  quote_or_location: "kt<=0.22: 1-0.09kt; 0.22<kt<=0.80: 0.9511-0.1604kt+4.388kt^2-16.638kt^3+12.336kt^4; kt>0.80: 0.165. IAU: 'S⊙ = 1361 W m−2'"
  solar_constant_w_m2: 1361.0
  eccentricity_amp: 0.033
  days_per_year: 365.0
  erbs_kt_breaks: [0.22, 0.80]
  erbs_low: [1.0, -0.09]
  erbs_mid: [0.9511, -0.1604, 4.388, -16.638, 12.336]
  erbs_high: 0.165
  kt_max: 1.0                     # numerical guard (DESIGN): clearness index cannot exceed 1
  min_sun_elevation_deg: 3.0      # pvlib erbs sets DNI = 0 for zenith > 87°

wind_profile:
  status: SECONDARY
  source: "z0: WMO Codes Registry, Davenport roughness class 'open' (VERIFIED). Log law for 10 m → body height: NWS/MDL Boyer TR (2022) NDFD WBGT Algorithm and Software Design (VERIFIED). 1.1 m standing abdomen height: ISO 7243/7726 as applied in Oliveira et al. 2018 Ind Health 56:62 and Ahmed et al. 2020 Ind Health 58:170 (ISO text paywalled)."
  url: "https://codes.wmo.int/wmdr/SurfaceRoughnessDavenport/open ; https://vlab.noaa.gov/documents/6609493/7858379/NDFD%2BWBGT%2BDescription%2BDocument.pdf"
  quote_or_location: "WMO: 'Level country with low vegetation (e.g. grass) and isolated obstacles … (zo 0.03)'; NDFD: 'To downscale the 10m winds to 2m, the NDFD application applies the Log Law.'; Oliveira 2018: measurements 'at 0.1, 1.1 and 1.7 m'"
  z_ref_m: 10.0
  z_body_m: 1.1
  z0_open_grass_m: 0.03

iso7933_dynamic:
  status: SECONDARY
  source: "ISO 7933:2004 Predicted Heat Strain, dynamic clothing corrections (Havenith, Holmér & Parsons 1999; Holmér et al. 1999) — equations read from pythermalcomfort v3.8.0 models/phs.py (ISO text paywalled, not read)"
  url: "https://github.com/CenterForTheBuiltEnvironment/pythermalcomfort/blob/master/pythermalcomfort/models/phs.py"
  quote_or_location: "phs.py: walk_sp = 0.0052*(met-58) capped 0.7; corr_cl = 1.044*exp((0.066*v_ux-0.398)*v_ux+(0.094*w_a_ux-0.378)*w_a_ux) (v_ux<=3, w_a_ux<=1.5), <=1; corr_ia = exp((0.047*v_r-0.472)*v_r+(0.117*w_a_ux-0.342)*w_a_ux), <=1; corr_tot blends below 0.6 clo; corr_e = (2.6*corr_tot-6.5)*corr_tot+4.9; im_dyn = min(i_mst*corr_e, 0.9); r_t_dyn = i_tot_dyn/im_dyn/16.7; i_a_st = 0.111; w_max = 0.85 (unacclimatized) or 1 (acclimatized)"
  note: "Applied because McCullough & Kenney's manikin was stationary in still air; ISO 7933 is the standard route from static to dynamic clothing values. Walking speed uses ISO's default from metabolic rate (capped at 0.7 m/s), which under-represents running — conservative."
  walk_coeff_m_s_per_w_m2: 0.0052
  walk_met_offset_w_m2: 58.0
  walk_cap_m_s: 0.7
  v_cap_m_s: 3.0
  w_cap_m_s: 1.5
  corr_cl: {scale: 1.044, v2: 0.066, v1: -0.398, w2: 0.094, w1: -0.378}
  corr_ia: {v2: 0.047, v1: -0.472, w2: 0.117, w1: -0.342}
  blend_below_clo: 0.6
  corr_e: [2.6, -6.5, 4.9]          # corr_e = (a*corr_tot + b)*corr_tot + c
  im_dyn_max: 0.9
  lewis_k_per_kpa: 16.7
  i_a_static_m2k_w: 0.111
  w_max_unacclimatized: 0.85
  w_max_acclimatized: 1.0          # interpolated with constants.acclimatization fraction (DESIGN)

optimizer:
  status: DESIGN
  note: "WS4 search settings and product requirements. Not physiology; coach/AT-owned where marked. MODEL.md does not apply."
  priority_weights: {1: 3.0, 2: 2.0, 3: 1.0}      # objective weight per drill priority (product choice)
  p1_min_kept_fraction: 0.9                       # WS4 brief: priority-1 drills kept at ≥ 90 % of their minutes
  max_added_minutes: 20                           # practice may grow by at most this much (coach's time window)
  inserted_break_gear: same_as_previous          # athletes keep the previous drill's gear on an added break (conservative)
  gear_floor_by_intensity: {hard: helmet, max: none}   # contact drills keep at least a helmet (coach-owned; PLAN.md demo: "team period drops to helmets-only")
  trim_step_min: 5
  lengthen_step_min: 4
  min_split_part_min: 5
  beam_width: 3
  beam_depth: 12
  beam_candidates_per_state: 40
  repair_loss_floor_pct: 1.0                     # beam ranks fixes by infeasibility removed per % load lost (+ this floor)
  beam_time_fraction: 0.35
  sa_time_fraction_end: 0.75
  sa_max_iterations: 1500
  sa_t0: 3.0
  sa_t_end: 0.03
  infeasibility_weight: 100.0                    # energy per unit infeasibility (1 FHSAA violation or 0.1 °C over)
  heat_excess_per_unit_c: 0.1
  change_penalty: 0.02                           # tie-break: energy per change (≪ 1 % of load)
  default_budget_s: 8.0

nata_gear_phasing:
  status: VERIFIED
  source: "Casa DJ, Csillan D et al. (2009) Preseason heat-acclimatization guidelines for secondary school athletics. J Athl Train 44(3):332-333 (PMC2681206), read by source-checker"
  url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2681206/"
  quote_or_location: "Days 1-2: 'a helmet should be the only protective equipment permitted'; days 3-5: 'only helmets and shoulder pads should be worn'; day 6 onward: 'all protective equipment may be worn'"
  note: "Applied per athlete from acclimatization_day. An explicit athlete.gear_limit can only tighten the limit. Breaks count: athletes keep the gear they wear."
  phases:
    - {first_day: 1, last_day: 2, max_gear: helmet}
    - {first_day: 3, last_day: 5, max_gear: helmet_shoulder_pads}
    - {first_day: 6, last_day: 9999, max_gear: full_pads}

armstrong_2010:
  status: VERIFIED
  source: "Armstrong LE, Johnson EC, Casa DJ et al. (2010) The American football uniform: uncompensable heat stress and hyperthermic exhaustion. J Athl Train 45(2):117-127 (PMC2838463) — Methods text and Tables 1, 3, 4 read (table images)"
  url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2838463/"
  quote_or_location: "'Ten men ... (age = 23.8 ± 4.3 years, height = 183.9 ± 6.3 cm, mass = 117.41 ± 12.59 kg, body fat = 30.1% ± 5.5%)'; chamber '33°C, 48%–49% relative humidity'; box lifting 20.4 kg, 10 lifts/min for 10 min; 10 min seated; treadmill '5.6 km/h, 5% grade' to 60 min or termination. Table 4 (treadmill only): CON 0.037 ± 0.015, PART 0.052 ± 0.012, FULL 0.071 ± 0.032 °C/min. Table 3: exposure 71.7 ± 13.4 / 63.1 ± 15.6 / 56.2 ± 13.2 min; rise 1.81 / 2.36 / 2.37 °C; start Tre 37.2 °C."
  participants: {age_yr: 23.8, height_m: 1.839, mass_kg: 117.41, body_fat_pct: 30.1, sex: male}
  chamber: {air_temp_c: 33.0, rh_pct: 48.5}
  protocol_min: {box_lifting: 10, seated: 10, treadmill_max: 60}
  start_rectal_c: 37.2
  exposure_min: {CON: 71.7, PART: 63.1, FULL: 56.2}
  treadmill_rate_c_per_min: {CON: [0.037, 0.015], PART: [0.052, 0.012], FULL: [0.071, 0.032]}   # [mean, SD]
  whole_protocol_rate_c_per_min: {CON: [0.026, 0.008], PART: [0.034, 0.006], FULL: [0.042, 0.010]}
  not_reported: "chamber air velocity, metabolic rate (VO2 not measured), heat-acclimatization status"

armstrong_2010_reproduction:
  status: DESIGN
  note: "Assumptions needed to simulate Armstrong 2010 (validation/armstrong_2010.py). MET values VERIFIED on pacompendium.com (2024 Adult Compendium); the task→code mapping and the air speed are judgement calls."
  met: {box_lifting: 4.0, seated: 1.0, treadmill: 5.3}
  met_codes: {box_lifting: "11820 Walking or walk downstairs or standing, carrying objects about 25 to 49 lbs", seated: "07021 Sitting quietly, general", treadmill: "17034 Climbing hills, no load, 1 to 5% grade, moderate-to-brisk pace"}
  air_speed_m_s: 0.1                 # not reported → Gagge's still-air floor
  air_speed_sensitivity_m_s: [0.1, 0.5, 1.0]
  gear_map: {CON: none, FULL: full_pads}   # PART (pants + pads, no helmet/shoulder pads) has no matching gear level
  acclimatization_day: 1             # status not reported → treated as unacclimatized

clothing_conservative:
  status: DESIGN
  note: "Conservative clothing mode (planning default), ISO 7933 structure with two changes, each constrained by Armstrong et al. 2010 (validation/armstrong_2010.py): (1) no credit for walking-induced clothing ventilation (ISO's walking-speed term off) — with it, the model under-predicts Armstrong CON by ~1 SD (0.022 vs 0.037 °C/min); the wind term is kept (still-air chamber data cannot test it). (2) A gear load surcharge on metabolic heat, M × (1 + δ·w(gear)), with δ calibrated so full pads reproduce Armstrong's mean FULL treadmill rise (0.071 °C/min); w interpolates by intrinsic insulation from 'none' (0) to 'full_pads' (1). Armstrong and Hitchcock 2007 both attribute extra metabolic cost to the uniform (Hitchcock: recovery 61.4 % VO2max with shoulder pads + helmet vs 40.1 % in shorts). δ lumps uniform weight, pad coverage and sweat-soaking; it is a calibration, not a measured quantity. Because CON informed (1) and FULL fixes (2), only the whole-protocol rates are unfitted checks."
  calibrated_by: "validation/armstrong_2010.py --calibrate"
  calibration_target: "armstrong_2010.treadmill_rate_c_per_min.FULL (mean, 0.071 °C/min)"
  iso_correction_fraction: 1.0
  walk_credit_fraction: 0.0
  gear_met_surcharge_full_pads: 0.1669   # computed by validation/armstrong_2010.py --calibrate (FULL treadmill 0.0710 °C/min)

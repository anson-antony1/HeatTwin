  status: SECONDARY
  source: "Arens E et al. (2015) Modeling the comfort effects of short-wave solar radiation indoors. Building and Environment 88:3-9, Eqs. 1, 6, 7 (open-access PDF read by source-checker); f_p table from pythermalcomfort v3.8.0 models/solar_gain.py; ASHRAE 55-2020 Appendix C not read"

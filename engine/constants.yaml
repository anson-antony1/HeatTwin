  quote_or_location: "Arens Eq.1 'ERF = feff hr (MRT - Ta)'; Eq.6 ERF_solar = (0.5 feff fsvv (Idiff + ITH Rfloor) + Ap fbes Idir/AD) Tsol (αSW/αLW); Eq.7 'Ap= feff fp AD'; f_eff '0.725 for a standing person'; αLW 'typically equal to 0.95'"

  quote_or_location: "sigma = 5.670 374 419 x 10^-8 W m^-2 K^-4 (exact); mmHg (conventional) -> Pa 1.333 224 E+02; kcal_th -> J 4.184 E+03; T/K = t/°C + 273.15"
  stefan_boltzmann_w_m2_k4: 5.670374419e-8
  kelvin_offset: 273.15
  pa_per_mmhg: 133.3224
  j_per_kcal: 4184.0
  s_per_h: 3600.0
  standard_gravity_m_s2: 9.80665   # NIST CODATA 'standard acceleration of gravity 9.806 65 m s^-2 (exact)' — physics.nist.gov/cgi-bin/cuu/Value?gn
  f_per_c: 1.8          # T/°F = 1.8·t/°C + 32 (SI Appendix B.9 temperature relations)
  f_offset: 32.0

gagge_1986:
